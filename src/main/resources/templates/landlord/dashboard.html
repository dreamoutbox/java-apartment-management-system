<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Landlord Portal - Apartment Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <!-- Reusable Sidebar Component -->
    <div th:replace="~{fragments/sidebar :: sidebar('LANDLORD', 'users')}"></div>

    <div class="main-content">
        <div class="header">
            <h1>Landlord Operations Portal</h1>
            <p>Manage users, rooms, lease agreements, announcements, and maintenance requests</p>
        </div>

        <div th:if="${errorMessage}" style="margin-bottom:16px;background:rgba(239,68,68,0.15);color:#fca5a5;border:1px solid rgba(239,68,68,0.3);padding:12px 16px;border-radius:8px;font-size:14px;">
            ⚠ <span th:text="${errorMessage}">Error</span>
        </div>
        <div th:if="${successMessage}" style="margin-bottom:16px;background:rgba(34,197,94,0.15);color:#86efac;border:1px solid rgba(34,197,94,0.3);padding:12px 16px;border-radius:8px;font-size:14px;">
            ✓ <span th:text="${successMessage}">Success</span>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Total Rooms</div>
                <div class="stat-value" th:text="${rooms.size()}">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Active Contracts</div>
                <div class="stat-value" th:text="${activeContracts.size()}">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Expiring Soon (30d)</div>
                <div class="stat-value" th:text="${expiringContracts.size()}">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Outstanding Balance</div>
                <div class="stat-value"
                    th:text="${'$' + #numbers.formatDecimal(totalOutstandingBalance != null ? totalOutstandingBalance : 0, 1, 2)}">
                    $0.00</div>
            </div>
        </div>

        <!-- User Component Section -->
        <div id="users-section" class="tab-section">
            <div th:replace="~{fragments/form-create-user :: createUserForm('/landlord/users')}"></div>
            <div th:replace="~{fragments/view-user :: userView(${users})}"></div>
        </div>

        <!-- Room Component Section -->
        <div id="rooms-section" class="tab-section" style="display:none;">
            <div th:replace="~{fragments/form-create-room :: createRoomForm('/landlord/rooms')}"></div>
            <div th:replace="~{fragments/view-room :: roomView(${rooms})}"></div>
        </div>

        <!-- Lease Contract Component Section -->
        <div id="contracts-section" class="tab-section" style="display:none;">
            <div th:replace="~{fragments/form-create-contract :: createContractForm(${rooms}, ${tenants}, '/landlord/contracts')}">
            </div>
            <div th:replace="~{fragments/view-contract :: contractView(${activeContracts}, ${expiringContracts})}"></div>
        </div>

        <!-- Announcement Component Section -->
        <div id="announcements-section" class="tab-section" style="display:none;">
            <div th:replace="~{fragments/form-publish-announcement :: publishAnnouncementForm('/landlord/announcements')}"></div>
            <div th:replace="~{fragments/view-announcement :: announcementView(${announcements})}"></div>
        </div>

        <!-- Maintenance Tickets Component Section -->
        <div id="tickets-section" class="tab-section" style="display:none;">
            <div th:replace="~{fragments/view-ticket :: ticketView(${tickets}, ${technicians}, '/landlord/tickets/assign')}">
            </div>
        </div>
    </div>

    <script th:src="@{/js/tables.js}"></script>
</body>

</html>
