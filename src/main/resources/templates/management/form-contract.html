<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title th:text="${contract != null ? 'Edit Lease Contract' : 'Create Lease Contract'}">Lease Contract Form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <div th:replace="~{fragments/sidebar :: sidebar('ADMIN', 'contracts')}"></div>

    <div class="main-content">
        <div class="header" style="display:flex;justify-content:space-between;align-items:center;">
            <div>
                <h1 th:text="${contract != null ? 'Edit Lease Contract' : 'Create Lease Contract'}">Lease Contract Form</h1>
                <p th:text="${contract != null ? 'Update rent rate, lease term dates, or status' : 'Assign room to tenant and establish lease terms'}">Manage contract agreements</p>
            </div>
            <a th:href="@{/contracts}" class="btn" style="background:#475569;">← Back to Contracts</a>
        </div>

        <div th:replace="~{fragments/forms :: contractForm(${contract}, ${rooms}, ${tenants})}"></div>
    </div>

</body>

</html>
