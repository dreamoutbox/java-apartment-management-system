<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Create Tenant Payment - Apartment Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <div th:replace="~{fragments/sidebar :: sidebar('ADMIN', 'payments')}"></div>

    <div class="main-content">
        <div class="header">
            <h1>Create Tenant Payment</h1>
            <p>Select tenant and enter payment amount to automatically allocate funds using FIFO (first-in-first-out)
            </p>
        </div>

        <div class="card" style="margin-bottom:24px;">
            <div class="card-title">Payment &amp; Receipt Entry</div>
            <form th:action="@{/payments/create}" method="post">
                <div class="form-group" style="margin-bottom:20px;">
                    <label style="font-weight:600;margin-bottom:8px;display:block;">Select Tenant</label>
                    <div
                        th:replace="~{fragments/table-tenant :: tenantTable(tenants=${tenants}, selectable=true, inputName='tenantId', selectedId=${selectedTenantId}, defaultLimit=5)}">
                    </div>
                </div>

                <div class="form-group" style="max-width:320px;margin-bottom:20px;">
                    <label style="font-weight:600;">Payment Amount ($)</label>
                    <input type="number" step="0.01" name="amount" class="form-control" placeholder="1500.00" required>
                </div>

                <div style="display:flex;gap:10px;margin-top:20px;">
                    <button type="submit" class="btn">Record Payment &amp; Issue Receipt</button>
                    <a th:href="@{/payments}" class="btn" style="background:#475569;">Cancel</a>
                </div>
            </form>
        </div>
    </div>

    <script th:src="@{/js/tables.js}"></script>
</body>

</html>
