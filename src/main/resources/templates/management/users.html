<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Users Management - Apartment Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <div th:replace="~{fragments/sidebar :: sidebar('ADMIN', 'users')}"></div>

    <div class="main-content">
        <div class="header" style="display:flex;justify-content:space-between;align-items:center;">
            <div>
                <h1>User Accounts Management</h1>
                <p>Create, update role details, and manage system user access</p>
            </div>
            <a th:href="@{/users/new}" class="btn">+ Create User</a>
        </div>
        <div class="card">
            <div class="card-title">Registered Users</div>
            <div th:replace="~{fragments/table-user :: userTable(users=${users})}"></div>
        </div>
    </div>

    <script th:src="@{/js/tables.js}"></script>
</body>

</html>
