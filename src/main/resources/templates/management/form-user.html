<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title th:text="${user != null ? 'Edit User Account' : 'Create User Account'}">User Account Form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <div th:replace="~{fragments/sidebar :: sidebar('ADMIN', 'users')}"></div>

    <div class="main-content">
        <div class="header" style="display:flex;justify-content:space-between;align-items:center;">
            <div>
                <h1 th:text="${user != null ? 'Edit User Account' : 'Create User Account'}">User Account Form</h1>
                <p th:text="${user != null ? 'Update user details, role permissions, and access status' : 'Fill in user credentials and select a role'}">Manage user accounts</p>
            </div>
            <a th:href="@{/users}" class="btn" style="background:#475569;">← Back to Users</a>
        </div>

        <div th:replace="~{fragments/forms :: userForm(${user})}"></div>
    </div>

</body>

</html>
