<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Announcements - Apartment Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <div th:replace="~{fragments/sidebar :: sidebar('TENANT PORTAL', 'announcements')}" sec:authorize="hasRole('TENANT')"></div>
    <div th:replace="~{fragments/sidebar :: sidebar('ADMIN', 'announcements')}" sec:authorize="!hasRole('TENANT')"></div>

    <div class="main-content">
        <div class="header" style="display:flex;justify-content:space-between;align-items:center;">
            <div>
                <h1>Building Announcements</h1>
                <p>Notices, building rules, and updates for all residents and staff</p>
            </div>
            <a th:href="@{/Announcements/new}" class="btn" sec:authorize="!hasRole('TENANT')">+ Publish Announcement</a>
        </div>
        <div class="card">
            <div class="card-title">Building Announcements</div>
            <div th:replace="~{fragments/table-announcement :: announcementTable(announcements=${announcements})}"></div>
        </div>
    </div>

    <script th:src="@{/js/tables.js}"></script>
</body>

</html>
