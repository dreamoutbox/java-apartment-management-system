<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Rooms Portfolio - Apartment Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <div th:replace="~{fragments/sidebar :: sidebar('ADMIN', 'rooms')}"></div>

    <div class="main-content">
        <div class="header" style="display:flex;justify-content:space-between;align-items:center;">
            <div>
                <h1>Room Portfolio Management</h1>
                <p>Add new units, adjust rent rates, and update room availability status</p>
            </div>
            <a th:href="@{/rooms/new}" class="btn">+ Create Room</a>
        </div>

        <div th:if="${errorMessage}" style="margin-bottom:16px;background:rgba(239,68,68,0.15);color:#fca5a5;border:1px solid rgba(239,68,68,0.3);padding:12px 16px;border-radius:8px;font-size:14px;">
            ⚠ <span th:text="${errorMessage}">Error</span>
        </div>
        <div th:if="${successMessage}" style="margin-bottom:16px;background:rgba(34,197,94,0.15);color:#86efac;border:1px solid rgba(34,197,94,0.3);padding:12px 16px;border-radius:8px;font-size:14px;">
            ✓ <span th:text="${successMessage}">Success</span>
        </div>
        <div th:replace="~{fragments/view-room :: roomView(${rooms})}"></div>
    </div>

    <script th:src="@{/js/tables.js}"></script>
</body>

</html>
