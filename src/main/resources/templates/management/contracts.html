<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Lease Contracts - Apartment Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <div th:replace="~{fragments/sidebar :: sidebar('ADMIN', 'contracts')}"></div>

    <div class="main-content">
        <div class="header" style="display:flex;justify-content:space-between;align-items:center;">
            <div>
                <h1>Lease Contracts Management</h1>
                <p>Issue lease agreements, configure monthly rent, and manage active contracts</p>
            </div>
            <a th:href="@{/contracts/new}" class="btn">+ Issue Contract</a>
        </div>
        <div class="card">
            <div class="card-title">Lease Contracts</div>
            <div th:if="${expiringContracts != null and not #lists.isEmpty(expiringContracts)}"
                style="margin-bottom:16px;background:rgba(245,158,11,0.15);color:#fcd34d;border:1px solid rgba(245,158,11,0.3);padding:10px;border-radius:8px;">
                ⚠ <strong th:text="${expiringContracts.size()}">0</strong> lease(s) expiring within 30 days.
            </div>
            <div
                th:replace="~{fragments/table-contract :: contractTable(contracts=${contracts}, expiringContracts=${expiringContracts})}">
            </div>
        </div>
    </div>

    <script th:src="@{/js/tables.js}"></script>
</body>

</html>
