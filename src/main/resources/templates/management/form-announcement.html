<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title th:text="${announcement != null ? 'Edit Announcement' : 'Publish Announcement'}">Announcement Form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <div th:replace="~{fragments/sidebar :: sidebar('ADMIN', 'announcements')}"></div>

    <div class="main-content">
        <div class="header" style="display:flex;justify-content:space-between;align-items:center;">
            <div>
                <h1 th:text="${announcement != null ? 'Edit Announcement' : 'Publish Announcement'}">Announcement Form</h1>
                <p th:text="${announcement != null ? 'Update notice text, announcement type, or pinning status' : 'Publish news or rules for residents and staff'}">Manage announcements</p>
            </div>
            <a th:href="@{/Announcements}" class="btn" style="background:#475569;">← Back to Announcements</a>
        </div>

        <div th:replace="~{fragments/forms :: announcementForm(${announcement})}"></div>
    </div>

    <script th:src="@{/js/tables.js}"></script>
</body>

</html>
