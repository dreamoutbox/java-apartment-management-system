<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Tenant Management - Apartment Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <div th:replace="~{fragments/sidebar :: sidebar('ADMIN', 'tenants')}"></div>

    <div class="main-content">
        <div class="header" style="display:flex;justify-content:space-between;align-items:center;">
            <div>
                <h1>Tenant Profiles Management</h1>
                <p>Create tenant user accounts, upload ID proof, and update tenant details</p>
            </div>
            <a th:href="@{/tenants/new}" class="btn">+ Create Tenant</a>
        </div>
        <div class="card">
            <div class="card-title">Tenant Profiles</div>
            <div th:replace="~{fragments/table-tenant :: tenantTable(tenants=${tenants})}"></div>
        </div>
    </div>

    <script th:src="@{/js/tables.js}"></script>
</body>

</html>
