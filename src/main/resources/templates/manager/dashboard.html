<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Manager Portal - Apartment Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Reusable Sidebar Component -->
<div th:replace="~{fragments/sidebar :: sidebar('MANAGER', 'users')}"></div>

<div class="main-content">
    <div class="header">
        <h1>Manager Operations Portal</h1>
        <p>Full control over users, rooms, lease agreements, announcements, and work orders</p>
    </div>

    <div th:if="${errorMessage}" style="margin-bottom:16px;background:rgba(239,68,68,0.15);color:#fca5a5;border:1px solid rgba(239,68,68,0.3);padding:12px 16px;border-radius:8px;font-size:14px;">
        ⚠ <span th:text="${errorMessage}">Error</span>
    </div>
    <div th:if="${successMessage}" style="margin-bottom:16px;background:rgba(34,197,94,0.15);color:#86efac;border:1px solid rgba(34,197,94,0.3);padding:12px 16px;border-radius:8px;font-size:14px;">
        ✓ <span th:text="${successMessage}">Success</span>
    </div>

    <!-- User Component Section -->
    <div id="users-section" class="tab-section">
        <div th:replace="~{fragments/form-create-user :: createUserForm('/manager/users')}"></div>
        <div th:replace="~{fragments/view-user :: userView(${users})}"></div>
    </div>

    <!-- Room Component Section -->
    <div id="rooms-section" class="tab-section" style="display:none;">
        <div th:replace="~{fragments/form-create-room :: createRoomForm('/manager/rooms')}"></div>
        <div th:replace="~{fragments/view-room :: roomView(${rooms})}"></div>
    </div>

    <!-- Lease Contract Component Section -->
    <div id="contracts-section" class="tab-section" style="display:none;">
        <div th:replace="~{fragments/form-create-contract :: createContractForm(${rooms}, ${tenants}, '/manager/contracts')}"></div>
        <div th:replace="~{fragments/view-contract :: contractView(${activeContracts}, ${null})}"></div>
    </div>

    <!-- Announcement Component Section -->
    <div id="announcements-section" class="tab-section" style="display:none;">
        <div th:replace="~{fragments/form-publish-announcement :: publishAnnouncementForm('/manager/announcements')}"></div>
        <div th:replace="~{fragments/view-announcement :: announcementView(${announcements})}"></div>
    </div>

    <!-- Maintenance Tickets Component Section -->
    <div id="tickets-section" class="tab-section" style="display:none;">
        <div th:replace="~{fragments/view-ticket :: ticketView(${tickets}, ${technicians}, '/manager/tickets/assign')}"></div>
    </div>
</div>

<script th:src="@{/js/tables.js}"></script>
</body>
</html>
