<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Manager Portal - Apartment Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Reusable Sidebar Component -->
<div th:replace="~{fragments/sidebar :: sidebar('MANAGER', 'users')}"></div>

<div class="main-content">
    <div class="header">
        <h1>Manager Operations Portal</h1>
        <p>Full control over users, rooms, lease agreements, announcements, and work orders</p>
    </div>

    <!-- User Component Section -->
    <div id="users-section" class="tab-section">
        <div th:replace="~{fragments/forms :: createUserForm('/manager/users')}"></div>
        <div th:replace="~{fragments/views :: userView(${tenants})}"></div>
    </div>

    <!-- Room Component Section -->
    <div id="rooms-section" class="tab-section" style="display:none;">
        <div th:replace="~{fragments/forms :: createRoomForm('/manager/rooms')}"></div>
        <div th:replace="~{fragments/views :: roomView(${rooms})}"></div>
    </div>

    <!-- Lease Contract Component Section -->
    <div id="contracts-section" class="tab-section" style="display:none;">
        <div th:replace="~{fragments/forms :: createContractForm(${rooms}, ${tenants}, '/manager/contracts')}"></div>
        <div th:replace="~{fragments/views :: contractView(${activeContracts}, ${null})}"></div>
    </div>

    <!-- Announcement Component Section -->
    <div id="announcements-section" class="tab-section" style="display:none;">
        <div th:replace="~{fragments/forms :: publishAnnouncementForm('/manager/announcements')}"></div>
        <div th:replace="~{fragments/views :: announcementView(${announcements})}"></div>
    </div>

    <!-- Maintenance Tickets Component Section -->
    <div id="tickets-section" class="tab-section" style="display:none;">
        <div th:replace="~{fragments/views :: ticketView(${tickets}, ${technicians}, '/manager/tickets/assign')}"></div>
    </div>
</div>

</body>
</html>
