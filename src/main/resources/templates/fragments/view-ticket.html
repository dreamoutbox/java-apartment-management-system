<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

    <div th:fragment="ticketView(tickets, technicians, assignActionUrl)" class="card">
        <div class="card-title"
            th:text="${selectable != null and selectable ? 'Select Ticket' : 'Maintenance Tickets'}">Maintenance Tickets
        </div>
        <div
            th:replace="~{fragments/table-ticket :: ticketTable(tickets=${tickets}, technicians=${technicians}, assignActionUrl=${assignActionUrl}, selectable=${selectable}, inputName=${inputName}, selectedId=${selectedId})}">
        </div>
    </div>

</body>

</html>
