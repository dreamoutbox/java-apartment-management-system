<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

    <div th:fragment="announcementView(announcements)" class="card">
        <div class="card-title"
            th:text="${selectable != null and selectable ? 'Select Announcement' : 'Building Announcements'}">Building
            Announcements</div>
        <div
            th:replace="~{fragments/table-announcement :: announcementTable(announcements=${announcements}, selectable=${selectable}, inputName=${inputName}, selectedId=${selectedId})}">
        </div>
    </div>

</body>

</html>
