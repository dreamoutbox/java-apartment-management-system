<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="createUserForm(actionUrl)" class="card">
    <div class="card-title">Create User Account</div>
    <form th:action="@{${actionUrl}}" method="post">
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" class="form-control" placeholder="john_doe" required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="fullName" class="form-control" placeholder="John Doe" required>
        </div>
        <div class="form-group">
            <label>Role</label>
            <select name="role" class="form-control" required>
                <option value="LANDLORD">LANDLORD</option>
                <option value="MANAGER">MANAGER</option>
                <option value="ACCOUNTANT">ACCOUNTANT</option>
                <option value="TECHNICIAN">TECHNICIAN</option>
                <option value="TENANT">TENANT</option>
            </select>
        </div>
        <button type="submit" class="btn">Create User</button>
    </form>
</div>

</body>
</html>
