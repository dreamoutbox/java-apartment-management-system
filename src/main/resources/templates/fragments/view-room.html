<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

    <div th:fragment="roomView(rooms)" class="card">
        <div class="card-title" th:text="${selectable != null and selectable ? 'Select Room' : 'Room Portfolio'}">Room Portfolio</div>
        <div th:replace="~{fragments/table-room :: roomTable(rooms=${rooms}, selectable=${selectable}, inputName=${inputName}, selectedId=${selectedId})}"></div>
    </div>

</body>

</html>
