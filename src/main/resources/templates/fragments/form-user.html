<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="userForm(user)" class="card" style="max-width:600px;">
    <div class="card-title" th:text="${user != null ? 'Edit User Account' : 'Create User Account'}">User Account Form</div>
    <form th:action="${user != null ? '/users/' + user.id + '/update' : '/users'}" method="post">
        <div th:if="${user == null}" class="form-group">
            <label>Username</label>
            <input type="text" name="username" class="form-control" placeholder="john_doe" required>
        </div>
        <div class="form-group">
            <label th:text="${user != null ? 'New Password (leave blank to keep current)' : 'Password'}">Password</label>
            <input type="password" name="password" class="form-control" th:required="${user == null}">
        </div>
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="fullName" th:value="${user != null ? user.fullName : ''}" class="form-control" placeholder="John Doe" required>
        </div>
        <div class="form-group">
            <label>Role</label>
            <select name="role" class="form-control" required>
                <option value="LANDLORD" th:selected="${user != null and user.role != null and user.role.name() == 'LANDLORD'}">LANDLORD</option>
                <option value="MANAGER" th:selected="${user != null and user.role != null and user.role.name() == 'MANAGER'}">MANAGER</option>
                <option value="ACCOUNTANT" th:selected="${user != null and user.role != null and user.role.name() == 'ACCOUNTANT'}">ACCOUNTANT</option>
                <option value="TECHNICIAN" th:selected="${user != null and user.role != null and user.role.name() == 'TECHNICIAN'}">TECHNICIAN</option>
                <option value="TENANT" th:selected="${user != null and user.role != null and user.role.name() == 'TENANT'}">TENANT</option>
            </select>
        </div>
        <div th:if="${user != null}" class="form-group" style="flex-direction:row;align-items:center;gap:10px;">
            <input type="checkbox" name="enabled" id="enabled-checkbox" value="true" th:checked="${user.enabled}">
            <label for="enabled-checkbox" style="margin:0;">Account Enabled</label>
        </div>
        <div style="display:flex;gap:10px;margin-top:20px;">
            <button type="submit" class="btn" th:text="${user != null ? 'Save Changes' : 'Create User'}">Submit</button>
            <a th:href="@{/users}" class="btn" style="background:#475569;">Cancel</a>
        </div>
    </form>
</div>

</body>
</html>
