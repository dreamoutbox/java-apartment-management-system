<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="contractForm(contract, rooms, tenants)" class="card" style="max-width:600px;">
    <div class="card-title" th:text="${contract != null ? 'Edit Lease Contract' : 'Create Lease Contract'}">Contract Form</div>
    <form th:action="${contract != null ? '/contracts/' + contract.id + '/update' : '/contracts'}" method="post">
        <div th:if="${contract == null}" class="form-group">
            <label>Room</label>
            <select name="roomId" class="form-control" required>
                <option value="">-- Select Room --</option>
                <option th:each="r : ${rooms}" th:value="${r.id}" th:text="${'Room ' + r.roomNumber + ' (' + r.status + ')'}"></option>
            </select>
        </div>
        <div th:if="${contract == null}" class="form-group">
            <label>Tenant</label>
            <select id="contractTenantSelect" name="tenantId" class="form-control" required>
                <option value="">-- Select Tenant --</option>
                <option th:each="t : ${tenants}" th:value="${t.id}" th:text="${t.fullName + ' (' + (t.user != null ? t.user.username : 'No User') + ')'}"></option>
            </select>
        </div>
        <div th:if="${contract != null}" class="form-group">
            <label>Assigned Room &amp; Tenant</label>
            <input type="text" class="form-control" th:value="${'Room ' + (contract.room != null ? contract.room.roomNumber : 'N/A') + ' — ' + (contract.tenant != null ? contract.tenant.fullName : 'N/A')}" disabled>
        </div>
        <div class="form-group">
            <label>Monthly Rent ($)</label>
            <input type="number" step="0.01" name="monthlyRent" th:value="${contract != null ? contract.monthlyRent : ''}" class="form-control" placeholder="1200.00" required>
        </div>
        <div class="form-group">
            <label>Start Date</label>
            <input type="date" name="startDate" th:value="${contract != null ? contract.startDate : ''}" class="form-control" required>
        </div>
        <div class="form-group">
            <label>End Date</label>
            <input type="date" name="endDate" th:value="${contract != null ? contract.endDate : ''}" class="form-control" required>
        </div>
        <div th:if="${contract != null}" class="form-group">
            <label>Status</label>
            <select name="status" class="form-control">
                <option value="ACTIVE" th:selected="${contract.status != null and contract.status.name() == 'ACTIVE'}">ACTIVE</option>
                <option value="EXPIRED" th:selected="${contract.status != null and contract.status.name() == 'EXPIRED'}">EXPIRED</option>
                <option value="TERMINATED" th:selected="${contract.status != null and contract.status.name() == 'TERMINATED'}">TERMINATED</option>
            </select>
        </div>
        <div style="display:flex;gap:10px;margin-top:20px;">
            <button type="submit" class="btn" th:text="${contract != null ? 'Save Changes' : 'Issue Contract'}">Submit</button>
            <a th:href="@{/contracts}" class="btn" style="background:#475569;">Cancel</a>
        </div>
    </form>
</div>

</body>
</html>
