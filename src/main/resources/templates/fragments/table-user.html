<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

    <table th:fragment="userTable(users)" class="data-table">
        <thead>
            <tr>
                <th th:if="${selectable != null and selectable}" style="width:50px;text-align:center;">Select</th>
                <th>Username</th>
                <th>Full Name</th>
                <th>Role</th>
                <th>Status</th>
                <th th:if="${selectable == null or !selectable}">Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="u : ${users}"
                th:classappend="${selectable != null and selectable ? 'selectable-row' + (selectedId != null and selectedId == u.id ? ' selected-row' : '') : ''}">
                <td th:if="${selectable != null and selectable}" style="text-align:center;">
                    <input type="radio" th:name="${inputName != null ? inputName : 'userId'}" th:value="${u.id}"
                        th:checked="${selectedId != null and selectedId == u.id}" required style="cursor:pointer;">
                </td>
                <td th:text="${u != null ? u.username : ''}">username</td>
                <td th:text="${u != null ? u.fullName : ''}">Full Name</td>
                <td th:text="${u != null and u.role != null ? u.role : ''}">ROLE</td>
                <td>
                    <span
                        th:class="${u != null and u.enabled ? 'status-badge status-OCCUPIED' : 'status-badge status-VACANT'}"
                        th:text="${u != null and u.enabled ? 'ACTIVE' : 'DISABLED'}">ACTIVE</span>
                </td>
                <td th:if="${selectable == null or !selectable}">
                    <div th:if="${u != null}" style="display:flex;gap:6px;">
                        <a th:href="@{'/users/' + ${u.id} + '/edit'}" class="btn"
                            style="padding:4px 10px;font-size:12px;">
                            Update
                        </a>
                        <form th:action="@{'/users/' + ${u.id} + '/delete'}" method="post"
                            onsubmit="return confirm('Delete this user account?');">
                            <button type="submit" class="btn"
                                style="padding:4px 10px;font-size:12px;background:#ef4444;">Delete</button>
                        </form>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>

</body>

</html>
