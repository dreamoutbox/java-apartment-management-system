<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="contractView(contracts, expiringContracts)" class="card">
    <div class="card-title">Lease Contracts</div>
    <div th:if="${expiringContracts != null and not #lists.isEmpty(expiringContracts)}"
         style="margin-bottom:16px;background:rgba(245,158,11,0.15);color:#fcd34d;border:1px solid rgba(245,158,11,0.3);padding:10px;border-radius:8px;">
        ⚠ <strong th:text="${expiringContracts.size()}">0</strong> lease(s) expiring within 30 days.
    </div>
    <table class="data-table">
        <thead>
            <tr>
                <th>Room</th>
                <th>Tenant</th>
                <th>Monthly Rent</th>
                <th>Start Date</th>
                <th>End Date</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="c : ${contracts}">
                <td th:text="${c != null and c.room != null ? c.room.roomNumber : 'N/A'}">101</td>
                <td th:text="${c != null and c.tenant != null ? c.tenant.fullName : 'N/A'}">Tenant</td>
                <td th:text="${'$' + (c != null ? c.monthlyRent : 0)}">$1200</td>
                <td th:text="${c != null ? c.startDate : ''}">2024-01-01</td>
                <td th:text="${c != null ? c.endDate : ''}">2024-12-31</td>
                <td><span th:class="${'status-badge status-' + (c != null ? c.status : 'ACTIVE')}" th:text="${c != null ? c.status : ''}">ACTIVE</span></td>
                <td>
                    <div th:if="${c != null}" style="display:flex;gap:6px;">
                        <button type="button" class="btn"
                                style="padding:4px 10px;font-size:12px;"
                                th:onclick="'openModal(\'modal-contract-' + ${c.id} + '\')'">Update</button>
                        <form th:action="@{'/contracts/' + ${c.id} + '/delete'}" method="post"
                              onsubmit="return confirm('Delete this lease contract?');">
                            <button type="submit" class="btn" style="padding:4px 10px;font-size:12px;background:#ef4444;">Delete</button>
                        </form>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>

    <!-- Update Modals for each Contract -->
    <div th:each="c : ${contracts}" th:if="${c != null}">
        <div class="ams-modal-overlay" th:id="'modal-contract-' + ${c.id}" style="display:none;">
            <div class="ams-modal-box">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                    <div class="card-title" style="margin:0;">Update Contract — Room <span th:text="${c.room != null ? c.room.roomNumber : ''}"></span></div>
                    <button type="button" class="btn" style="background:#ef4444;padding:4px 12px;font-size:12px;"
                            th:onclick="'closeModal(\'modal-contract-' + ${c.id} + '\')'">✕ Close</button>
                </div>
                <form th:action="@{'/contracts/' + ${c.id} + '/update'}" method="post">
                    <div class="form-group">
                        <label>Monthly Rent ($)</label>
                        <input type="number" step="0.01" name="monthlyRent" th:value="${c.monthlyRent}" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Start Date</label>
                        <input type="date" name="startDate" th:value="${c.startDate}" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>End Date</label>
                        <input type="date" name="endDate" th:value="${c.endDate}" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Status</label>
                        <select name="status" class="form-control">
                            <option value="ACTIVE" th:selected="${c.status != null and c.status.name() == 'ACTIVE'}">ACTIVE</option>
                            <option value="EXPIRED" th:selected="${c.status != null and c.status.name() == 'EXPIRED'}">EXPIRED</option>
                            <option value="TERMINATED" th:selected="${c.status != null and c.status.name() == 'TERMINATED'}">TERMINATED</option>
                        </select>
                    </div>
                    <button type="submit" class="btn">Save Changes</button>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
