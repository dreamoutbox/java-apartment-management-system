<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

    <div th:fragment="contractView(contracts, expiringContracts)" class="card">
        <div class="card-title"
            th:text="${selectable != null and selectable ? 'Select Lease Contract' : 'Lease Contracts'}">Lease Contracts
        </div>
        <div th:if="${expiringContracts != null and not #lists.isEmpty(expiringContracts)}"
            style="margin-bottom:16px;background:rgba(245,158,11,0.15);color:#fcd34d;border:1px solid rgba(245,158,11,0.3);padding:10px;border-radius:8px;">
            ⚠ <strong th:text="${expiringContracts.size()}">0</strong> lease(s) expiring within 30 days.
        </div>
        <div
            th:replace="~{fragments/table-contract :: contractTable(contracts=${contracts}, expiringContracts=${expiringContracts}, selectable=${selectable}, inputName=${inputName}, selectedId=${selectedId})}">
        </div>
    </div>

</body>

</html>
