<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<div th:fragment="sidebar(role, activeTab)" class="sidebar">
    <div class="sidebar-brand">
        <div class="brand-icon">
            <svg viewBox="0 0 24 24"><path d="M3 21h18M3 10h18M5 6l7-3 7 3M4 10v11M20 10v11M8 14h2v3H8zM14 14h2v3h-2z"/></svg>
        </div>
        <div>
            <div class="brand-title">Apartment Hub</div>
            <div class="role-badge" th:text="${role}">MANAGER</div>
        </div>
    </div>

    <div class="sidebar-nav">
        <button type="button" class="nav-link" th:classappend="${activeTab == 'users' ? 'active' : ''}" onclick="switchTab('users-section', this)">
            <svg style="width:18px;height:18px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            User
        </button>
        <button type="button" class="nav-link" th:classappend="${activeTab == 'rooms' ? 'active' : ''}" onclick="switchTab('rooms-section', this)">
            <svg style="width:18px;height:18px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            Room
        </button>
        <button type="button" class="nav-link" th:classappend="${activeTab == 'contracts' ? 'active' : ''}" onclick="switchTab('contracts-section', this)">
            <svg style="width:18px;height:18px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            Lease Contract
        </button>
        <button type="button" class="nav-link" th:classappend="${activeTab == 'announcements' ? 'active' : ''}" onclick="switchTab('announcements-section', this)">
            <svg style="width:18px;height:18px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
            Announcement
        </button>
        <button type="button" class="nav-link" th:classappend="${activeTab == 'tickets' ? 'active' : ''}" onclick="switchTab('tickets-section', this)">
            <svg style="width:18px;height:18px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/></svg>
            Maintenance Tickets
        </button>
    </div>

    <div class="user-profile">
        <div class="user-name" sec:authentication="name">User</div>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="logout-btn" style="background:none;border:none;cursor:pointer;">Sign Out</button>
        </form>
    </div>

    <script>
        function switchTab(sectionId, btn) {
            document.querySelectorAll('.tab-section').forEach(sec => sec.style.display = 'none');
            document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));
            
            const target = document.getElementById(sectionId);
            if (target) {
                target.style.display = 'block';
            }
            if (btn) {
                btn.classList.add('active');
            }
        }
    </script>
</div>

</body>
</html>
