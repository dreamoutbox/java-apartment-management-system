<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<table th:fragment="meterReadingTable(readings)" class="data-table">
    <thead>
        <tr>
            <th>Billing Period</th>
            <th>Room #</th>
            <th>Floor</th>
            <th>Electricity Reading (kWh)</th>
            <th>Water Reading (m³)</th>
            <th sec:authorize="!hasRole('TENANT')">Actions</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="m : ${readings}">
            <td th:text="${m.period}" style="font-weight:600;">2026-07</td>
            <td th:text="${m.room != null ? m.room.roomNumber : 'N/A'}">101</td>
            <td th:text="${m.room != null ? m.room.floor : 'N/A'}">1</td>
            <td th:text="${m.electricityReading + ' kWh'}" style="color:#60a5fa;font-weight:500;">1250.50 kWh</td>
            <td th:text="${m.waterReading + ' m³'}" style="color:#38bdf8;font-weight:500;">340.00 m³</td>
            <td sec:authorize="!hasRole('TENANT')">
                <div style="display:flex;gap:6px;">
                    <a th:href="@{'/meter-readings/' + ${m.id} + '/edit'}" class="btn" style="padding:4px 10px;font-size:12px;background:#3b82f6;">Edit</a>
                    <form th:action="@{'/meter-readings/' + ${m.id} + '/delete'}" method="post" onsubmit="return confirm('Delete this meter reading?');">
                        <button type="submit" class="btn" style="padding:4px 10px;font-size:12px;background:#ef4444;">Delete</button>
                    </form>
                </div>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(readings)}">
            <td th:colspan="${#authorization != null and #authorization.expression('hasRole(''TENANT'')') ? 5 : 6}" style="text-align:center;color:#94a3b8;padding:24px;">No meter readings recorded yet.</td>
        </tr>
    </tbody>
</table>

</body>
</html>
