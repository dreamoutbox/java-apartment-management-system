<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="createContractForm(rooms, tenants, actionUrl)" class="card">
    <div class="card-title">Create Lease Contract</div>
    <form th:action="@{${actionUrl}}" method="post">
        <div class="form-group">
            <label>Room</label>
            <select name="roomId" class="form-control" required>
                <option th:each="r : ${rooms}" th:value="${r.id}" th:text="${r.roomNumber + ' (' + r.status + ')'}"></option>
            </select>
        </div>
        <div class="form-group">
            <label>Tenant</label>
            <div style="display:flex;gap:8px;">
                <select id="contractTenantSelect" name="tenantId" class="form-control" required>
                    <option value="">-- Select Tenant --</option>
                    <option th:each="t : ${tenants}" th:value="${t.id}" th:text="${t.fullName + ' (' + (t.user != null ? t.user.username : 'No User') + ')'}"></option>
                </select>
                <button type="button" class="btn" style="white-space:nowrap;" onclick="openTenantPickerModal()">Browse</button>
            </div>
        </div>
        <div class="form-group">
            <label>Monthly Rent ($)</label>
            <input type="number" step="0.01" name="monthlyRent" class="form-control" placeholder="1200.00">
        </div>
        <div class="form-group">
            <label>Start Date</label>
            <input type="date" name="startDate" class="form-control" required>
        </div>
        <div class="form-group">
            <label>End Date</label>
            <input type="date" name="endDate" class="form-control" required>
        </div>
        <button type="submit" class="btn">Issue Contract</button>
    </form>

    <!-- Modal for selecting tenant -->
    <div id="tenantPickerModal" class="ams-modal-overlay" style="display:none;">
        <div class="ams-modal-box">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                <div class="card-title" style="margin:0;">Select Tenant</div>
                <button type="button" class="btn" style="background:#ef4444;padding:4px 12px;font-size:12px;" onclick="closeTenantPickerModal()">✕ Close</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Full Name</th>
                        <th>Phone</th>
                        <th>Email</th>
                        <th>ID Card #</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="t : ${tenants}">
                        <td th:text="${t.fullName}">Name</td>
                        <td th:text="${t.phone}">Phone</td>
                        <td th:text="${t.email}">Email</td>
                        <td th:text="${t.idCardNumber}">ID</td>
                        <td>
                            <button type="button" class="btn" style="padding:4px 10px;font-size:12px;"
                                    th:data-id="${t.id}" th:data-name="${t.fullName}"
                                    onclick="selectTenantFromModal(this.getAttribute('data-id'))">Select</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function openTenantPickerModal() { document.getElementById('tenantPickerModal').style.display = 'flex'; }
        function closeTenantPickerModal() { document.getElementById('tenantPickerModal').style.display = 'none'; }
        function selectTenantFromModal(id) {
            document.getElementById('contractTenantSelect').value = id;
            closeTenantPickerModal();
        }
    </script>
</div>

</body>
</html>
