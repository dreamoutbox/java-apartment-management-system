<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="announcementForm(announcement)" class="card" style="max-width:600px;">
    <div class="card-title" th:text="${announcement != null ? 'Edit Announcement' : 'Publish Announcement'}">Announcement Form</div>
    <form th:action="${announcement != null ? '/Announcements/' + announcement.id + '/update' : '/Announcements'}" method="post">
        <div class="form-group">
            <label>Title</label>
            <input type="text" name="title" th:value="${announcement != null ? announcement.title : ''}" class="form-control" placeholder="Important Notice" required>
        </div>
        <div class="form-group">
            <label>Type</label>
            <select name="type" class="form-control">
                <option value="NEWS" th:selected="${announcement != null and announcement.type != null and announcement.type.name() == 'NEWS'}">NEWS</option>
                <option value="RULE" th:selected="${announcement != null and announcement.type != null and announcement.type.name() == 'RULE'}">RULE</option>
            </select>
        </div>
        <div class="form-group">
            <label>Content</label>
            <textarea name="content" class="form-control" rows="4" placeholder="Enter announcement text..." required th:text="${announcement != null ? announcement.content : ''}"></textarea>
        </div>
        <div class="form-group" style="flex-direction:row;align-items:center;gap:10px;">
            <input type="checkbox" name="pinned" id="pinned-cb" value="true" th:checked="${announcement != null and announcement.pinned}">
            <label for="pinned-cb" style="margin:0;">Pin to top</label>
        </div>
        <div style="display:flex;gap:10px;margin-top:20px;">
            <button type="submit" class="btn" th:text="${announcement != null ? 'Save Changes' : 'Publish Announcement'}">Submit</button>
            <a th:href="@{/Announcements}" class="btn" style="background:#475569;">Cancel</a>
        </div>
    </form>
</div>

</body>
</html>
