<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

    <div th:fragment="userView(users)" class="card">
        <div class="card-title" th:text="${selectable != null and selectable ? 'Select User' : 'Registered Users'}">Registered Users</div>
        <div th:replace="~{fragments/table-user :: userTable(users=${users}, selectable=${selectable}, inputName=${inputName}, selectedId=${selectedId})}"></div>
    </div>

</body>

</html>
