<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<table th:fragment="roomTable(rooms)" class="data-table">
    <thead>
        <tr>
            <th th:if="${selectable != null and selectable}" style="width:50px;text-align:center;">Select</th>
            <th th:if="${columns == null or #lists.contains(columns, 'roomNumber')}">Room #</th>
            <th th:if="${columns == null or #lists.contains(columns, 'floor')}">Floor</th>
            <th th:if="${columns == null or #lists.contains(columns, 'baseRent')}">Base Rent</th>
            <th th:if="${columns == null or #lists.contains(columns, 'status')}">Status</th>
            <th th:if="${selectable == null or !selectable}">Actions</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="room : ${rooms}"
            th:attr="data-deleted=${room != null and room.deleted}"
            th:classappend="${(room != null and room.deleted ? 'deleted-record ' : '') + (selectable != null and selectable ? 'selectable-row' + (selectedId != null and selectedId == room.id ? ' selected-row' : '') : '')}">
            <td th:if="${selectable != null and selectable}" style="text-align:center;">
                <input type="radio" th:name="${inputName != null ? inputName : 'roomId'}" th:value="${room.id}"
                    th:checked="${selectedId != null and selectedId == room.id}" th:disabled="${room != null and room.deleted}" required style="cursor:pointer;">
            </td>
            <td th:if="${columns == null or #lists.contains(columns, 'roomNumber')}" th:text="${room != null ? room.roomNumber : ''}">101</td>
            <td th:if="${columns == null or #lists.contains(columns, 'floor')}" th:text="${room != null ? room.floor : ''}">1</td>
            <td th:if="${columns == null or #lists.contains(columns, 'baseRent')}" th:text="${'$' + (room != null ? room.baseRent : 0)}">$1200</td>
            <td th:if="${columns == null or #lists.contains(columns, 'status')}">
                <span th:if="${room != null and room.deleted}" class="status-badge status-DELETED">DELETED</span>
                <span th:unless="${room != null and room.deleted}"
                    th:class="${'status-badge status-' + (room != null ? room.status : 'VACANT')}"
                    th:text="${room != null ? room.status : ''}">VACANT</span>
            </td>
            <td th:if="${selectable == null or !selectable}">
                <div th:if="${room != null and room.deleted}">
                    <span style="color:#ef4444;font-size:12px;font-weight:600;">Deleted</span>
                </div>
                <div th:if="${room != null and !room.deleted}" style="display:flex;gap:6px;">
                    <a th:href="@{'/rooms/' + ${room.id} + '/edit'}" class="btn"
                        style="padding:4px 10px;font-size:12px;">Update</a>
                    <form th:action="@{'/rooms/' + ${room.id} + '/delete'}" method="post"
                        onsubmit="return confirm('Delete this room?');">
                        <button type="submit" class="btn"
                            style="padding:4px 10px;font-size:12px;background:#ef4444;">Delete</button>
                    </form>
                </div>
            </td>
        </tr>
    </tbody>
</table>

</body>
</html>
