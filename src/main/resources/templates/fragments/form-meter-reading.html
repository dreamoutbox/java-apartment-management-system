<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="meterReadingForm(reading, rooms)" class="card" style="max-width:650px;">
    <div class="card-title" th:text="${reading != null ? 'Update Meter Reading' : 'Record Meter Reading'}">Meter Reading Form</div>

    <form th:action="@{/meter-readings/save}" method="post">
        <!-- Room Selection -->
        <div th:if="${reading == null}" class="form-group">
            <label style="font-weight:600;">Select Room</label>
            <select name="roomId" class="form-control" required>
                <option value="">-- Select Room Unit --</option>
                <option th:each="r : ${rooms}" th:value="${r.id}"
                    th:text="${'Room ' + r.roomNumber + ' (Floor ' + r.floor + ' - ' + r.status + ')'}"></option>
            </select>
        </div>

        <div th:if="${reading != null}" class="form-group">
            <label style="font-weight:600;">Room Unit</label>
            <input type="hidden" name="roomId" th:value="${reading.room != null ? reading.room.id : ''}">
            <input type="text" class="form-control"
                th:value="${'Room ' + (reading.room != null ? reading.room.roomNumber : 'N/A') + ' (Floor ' + (reading.room != null ? reading.room.floor : 'N/A') + ')'}" disabled>
        </div>

        <!-- Period -->
        <div class="form-group">
            <label style="font-weight:600;">Billing Period (YYYY-MM)</label>
            <input type="text" name="period" th:value="${reading != null ? reading.period : '2026-07'}" class="form-control" placeholder="2026-07" required>
        </div>

        <!-- Electricity and Water Readings -->
        <div class="form-row">
            <div class="form-group">
                <label style="font-weight:600;">Electricity Meter Reading (kWh)</label>
                <input type="number" step="0.01" name="electricityReading"
                    th:value="${reading != null ? reading.electricityReading : ''}"
                    class="form-control" placeholder="e.g. 1250.50" required>
            </div>
            <div class="form-group">
                <label style="font-weight:600;">Water Meter Reading (m³)</label>
                <input type="number" step="0.01" name="waterReading"
                    th:value="${reading != null ? reading.waterReading : ''}"
                    class="form-control" placeholder="e.g. 340.00" required>
            </div>
        </div>

        <div style="display:flex;gap:10px;margin-top:20px;">
            <button type="submit" class="btn" th:text="${reading != null ? 'Save Changes' : 'Record Meter Reading'}">Save</button>
            <a th:href="@{/meter-readings}" class="btn" style="background:#475569;">Cancel</a>
        </div>
    </form>
</div>

</body>
</html>
