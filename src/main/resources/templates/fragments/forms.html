<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Create User Form Fragment -->
<div th:fragment="createUserForm(actionUrl)" class="card">
    <div class="card-title">Create User Account</div>
    <form th:action="@{${actionUrl}}" method="post">
        <div class="form-row">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" class="form-control" placeholder="john_doe" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="fullName" class="form-control" placeholder="John Doe" required>
            </div>
            <div class="form-group">
                <label>Role</label>
                <select name="role" class="form-control" required>
                    <option value="LANDLORD">LANDLORD</option>
                    <option value="MANAGER">MANAGER</option>
                    <option value="ACCOUNTANT">ACCOUNTANT</option>
                    <option value="TECHNICIAN">TECHNICIAN</option>
                    <option value="TENANT">TENANT</option>
                </select>
            </div>
        </div>
        <button type="submit" class="btn">Create User</button>
    </form>
</div>

<!-- Create Room Form Fragment -->
<div th:fragment="createRoomForm(actionUrl)" class="card">
    <div class="card-title">Add New Room</div>
    <form th:action="@{${actionUrl}}" method="post">
        <div class="form-row">
            <div class="form-group">
                <label>Room Number</label>
                <input type="text" name="roomNumber" class="form-control" placeholder="101" required>
            </div>
            <div class="form-group">
                <label>Floor</label>
                <input type="text" name="floor" class="form-control" placeholder="1" required>
            </div>
            <div class="form-group">
                <label>Base Rent ($)</label>
                <input type="number" step="0.01" name="baseRent" class="form-control" placeholder="1200.00" required>
            </div>
        </div>
        <button type="submit" class="btn">Create Room</button>
    </form>
</div>

<!-- Create Contract Form Fragment -->
<div th:fragment="createContractForm(rooms, tenants, actionUrl)" class="card">
    <div class="card-title">Create Lease Contract</div>
    <form th:action="@{${actionUrl}}" method="post">
        <div class="form-row">
            <div class="form-group">
                <label>Room</label>
                <select name="roomId" class="form-control" required>
                    <option th:each="r : ${rooms}" th:value="${r.id}" th:text="${r.roomNumber + ' (' + r.status + ')'}"></option>
                </select>
            </div>
            <div class="form-group">
                <label>Tenant</label>
                <select name="tenantId" class="form-control" required>
                    <option th:each="t : ${tenants}" th:value="${t.id}" th:text="${t.fullName}"></option>
                </select>
            </div>
            <div class="form-group">
                <label>Monthly Rent ($)</label>
                <input type="number" step="0.01" name="monthlyRent" class="form-control" placeholder="1200.00">
            </div>
            <div class="form-group">
                <label>Start Date</label>
                <input type="date" name="startDate" class="form-control" required>
            </div>
            <div class="form-group">
                <label>End Date</label>
                <input type="date" name="endDate" class="form-control" required>
            </div>
        </div>
        <button type="submit" class="btn">Issue Contract</button>
    </form>
</div>

<!-- Publish Announcement Form Fragment -->
<div th:fragment="publishAnnouncementForm(actionUrl)" class="card">
    <div class="card-title">Publish Announcement</div>
    <form th:action="@{${actionUrl}}" method="post">
        <div class="form-row">
            <div class="form-group">
                <label>Title</label>
                <input type="text" name="title" class="form-control" placeholder="Important Notice" required>
            </div>
            <div class="form-group">
                <label>Type</label>
                <select name="type" class="form-control">
                    <option value="NEWS">NEWS</option>
                    <option value="RULE">RULE</option>
                </select>
            </div>
            <div class="form-group" style="flex-direction:row;align-items:center;gap:10px;margin-top:24px;">
                <input type="checkbox" name="pinned" id="pinned" value="true">
                <label for="pinned">Pin to top</label>
            </div>
        </div>
        <div class="form-group" style="margin-bottom:16px;">
            <label>Content</label>
            <textarea name="content" class="form-control" rows="3" placeholder="Enter announcement text..." required></textarea>
        </div>
        <button type="submit" class="btn">Publish Announcement</button>
    </form>
</div>

</body>
</html>
