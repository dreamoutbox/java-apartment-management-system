<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

    <div th:fragment="userForm(user)"
        th:replace="~{fragments/form-user :: userForm(${user})}"></div>

    <div th:fragment="tenantForm(tenant)"
        th:replace="~{fragments/form-tenant :: tenantForm(${tenant})}"></div>

    <div th:fragment="roomForm(room)"
        th:replace="~{fragments/form-room :: roomForm(${room})}"></div>

    <div th:fragment="contractForm(contract, rooms, tenants)"
        th:replace="~{fragments/form-contract :: contractForm(${contract}, ${rooms}, ${tenants})}"></div>

    <div th:fragment="announcementForm(announcement)"
        th:replace="~{fragments/form-publish-announcement :: announcementForm(${announcement})}"></div>

    <div th:fragment="ticketForm(ticket, rooms, tenants, technicians)"
        th:replace="~{fragments/form-ticket :: ticketForm(${ticket}, ${rooms}, ${tenants}, ${technicians})}"></div>

</body>

</html>
