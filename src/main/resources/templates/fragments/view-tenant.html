<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

    <div th:fragment="tenantView(tenants)" class="card">
        <div class="card-title" th:text="${selectable != null and selectable ? 'Select Tenant' : 'Tenant Profiles'}">
            Tenant Profiles</div>
        <div
            th:replace="~{fragments/table-tenant :: tenantTable(tenants=${tenants}, selectable=${selectable}, inputName=${inputName}, selectedId=${selectedId})}">
        </div>
    </div>

</body>

</html>
