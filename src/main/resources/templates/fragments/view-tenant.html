<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="tenantView(tenants)" class="card">
    <div class="card-title">Tenant Profiles</div>
    <table class="data-table">
        <thead>
            <tr>
                <th>Full Name</th>
                <th>Username</th>
                <th>Phone</th>
                <th>Email</th>
                <th>ID Card #</th>
                <th>Proof ID</th>
                <th>Credit</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="t : ${tenants}">
                <td th:text="${t != null ? t.fullName : ''}">Name</td>
                <td th:text="${t != null and t.user != null ? t.user.username : 'N/A'}">username</td>
                <td th:text="${t != null ? t.phone : ''}">Phone</td>
                <td th:text="${t != null ? t.email : ''}">Email</td>
                <td th:text="${t != null ? t.idCardNumber : ''}">ID</td>
                <td>
                    <a th:if="${t != null and t.idCardImagePath != null}"
                       th:href="@{'/uploads/' + ${t.idCardImagePath}}"
                       target="_blank" style="color:var(--primary);font-size:12px;text-decoration:underline;">View</a>
                    <span th:unless="${t != null and t.idCardImagePath != null}" style="color:#64748b;font-size:12px;">—</span>
                </td>
                <td th:text="${'$' + (t != null and t.creditBalance != null ? t.creditBalance : 0)}">$0.00</td>
                <td>
                    <div th:if="${t != null}" style="display:flex;gap:6px;">
                        <button type="button" class="btn"
                                style="padding:4px 10px;font-size:12px;"
                                th:onclick="'openModal(\'modal-tenant-' + ${t.id} + '\')'">Update</button>
                        <form th:action="@{'/tenants/' + ${t.id} + '/delete'}" method="post"
                              onsubmit="return confirm('Delete tenant and their user account?');">
                            <button type="submit" class="btn" style="padding:4px 10px;font-size:12px;background:#ef4444;">Delete</button>
                        </form>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>

    <!-- Update Modals for each Tenant -->
    <div th:each="t : ${tenants}" th:if="${t != null}">
        <div class="ams-modal-overlay" th:id="'modal-tenant-' + ${t.id}" style="display:none;">
            <div class="ams-modal-box">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                    <div class="card-title" style="margin:0;">Update Tenant</div>
                    <button type="button" class="btn" style="background:#ef4444;padding:4px 12px;font-size:12px;"
                            th:onclick="'closeModal(\'modal-tenant-' + ${t.id} + '\')'">✕ Close</button>
                </div>
                <form th:action="@{'/tenants/' + ${t.id} + '/update'}" method="post" enctype="multipart/form-data">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" name="fullName" th:value="${t.fullName}" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Phone</label>
                        <input type="text" name="phone" th:value="${t.phone}" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" name="email" th:value="${t.email}" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>ID Card Number</label>
                        <input type="text" name="idCardNumber" th:value="${t.idCardNumber}" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Replace ID Card Photo</label>
                        <input type="file" name="idCardImage" class="form-control" accept="image/*">
                    </div>
                    <button type="submit" class="btn">Save Changes</button>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
