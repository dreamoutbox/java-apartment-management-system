<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="tenantView(tenants)" class="card">
    <div class="card-title">Tenant Profiles</div>
    <table class="data-table">
        <thead>
            <tr>
                <th>Full Name</th>
                <th>Username</th>
                <th>Phone</th>
                <th>Email</th>
                <th>ID Card #</th>
                <th>Proof ID</th>
                <th>Credit</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="t : ${tenants}">
                <td th:text="${t != null ? t.fullName : ''}">Name</td>
                <td th:text="${t != null and t.user != null ? t.user.username : 'N/A'}">username</td>
                <td th:text="${t != null ? t.phone : ''}">Phone</td>
                <td th:text="${t != null ? t.email : ''}">Email</td>
                <td th:text="${t != null ? t.idCardNumber : ''}">ID</td>
                <td>
                    <a th:if="${t != null and t.idCardImagePath != null}"
                       th:href="@{'/uploads/' + ${t.idCardImagePath}}"
                       target="_blank" style="color:var(--primary);font-size:12px;text-decoration:underline;">View</a>
                    <span th:unless="${t != null and t.idCardImagePath != null}" style="color:#64748b;font-size:12px;">—</span>
                </td>
                <td th:text="${'$' + (t != null and t.creditBalance != null ? t.creditBalance : 0)}">$0.00</td>
                <td>
                    <div th:if="${t != null}" style="display:flex;gap:6px;">
                        <a th:href="@{'/tenants/' + ${t.id} + '/edit'}" class="btn"
                           style="padding:4px 10px;font-size:12px;">Update</a>
                        <form th:action="@{'/tenants/' + ${t.id} + '/delete'}" method="post"
                              onsubmit="return confirm('Delete tenant and their user account?');">
                            <button type="submit" class="btn" style="padding:4px 10px;font-size:12px;background:#ef4444;">Delete</button>
                        </form>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
