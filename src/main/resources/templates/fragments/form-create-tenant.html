<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="createTenantForm(actionUrl)" class="card">
    <div class="card-title">Create Tenant &amp; Account</div>
    <form th:action="@{${actionUrl}}" method="post" enctype="multipart/form-data">
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" class="form-control" placeholder="tenant1" required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="fullName" class="form-control" placeholder="Alice Smith" required>
        </div>
        <div class="form-group">
            <label>Phone</label>
            <input type="text" name="phone" class="form-control" placeholder="555-0199">
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" class="form-control" placeholder="alice@example.com">
        </div>
        <div class="form-group">
            <label>ID Card Number</label>
            <input type="text" name="idCardNumber" class="form-control" placeholder="ID9876543">
        </div>
        <div class="form-group">
            <label>Proof Tenant ID Card Photo</label>
            <input type="file" name="idCardImage" class="form-control" accept="image/*">
        </div>
        <button type="submit" class="btn">Create Tenant</button>
    </form>
</div>

</body>
</html>
