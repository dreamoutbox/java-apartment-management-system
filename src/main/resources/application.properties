spring.application.name=ams
server.port=8080

# Database Configuration (H2 in dev, can switch to PostgreSQL in prod)
spring.datasource.url=jdbc:h2:mem:amsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# App Custom Config
app.upload.dir=uploads
app.lease.renewal-warning-days=30
