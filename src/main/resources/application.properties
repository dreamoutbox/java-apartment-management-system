spring.application.name=ams
server.port=8080

# PostgreSQL Database Configuration from docker-compose.base.yml
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=example

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# App Custom Config
app.upload.dir=uploads
app.lease.renewal-warning-days=30

# Show full error details in browser (dev only)
server.error.include-message=always
server.error.include-exception=true
server.error.include-stacktrace=always

# Multipart File Upload Configuration (20MB Max)
spring.servlet.multipart.enabled=true
# max-file-size default: 1MB (maximum size allowed for a single uploaded file).
spring.servlet.multipart.max-file-size=5MB
# max-request-size default: 10MB (maximum total size allowed for the entire multipart/form-data request).
spring.servlet.multipart.max-request-size=5MB
