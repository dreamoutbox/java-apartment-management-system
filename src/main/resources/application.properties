spring.application.name=ams
server.port=8080

# SQLite Database Configuration
spring.datasource.url=jdbc:sqlite:./data/ams.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# Minimum number of idle connections maintained in the pool
spring.datasource.hikari.minimum-idle=5
# Maximum number of connections allowed in the pool
spring.datasource.hikari.maximum-pool-size=10
# FIX Minimum pool size: undefined/unknown & Maximum pool size: undefined/unknown
# spring.jpa.properties.hibernate.connection.url=${spring.datasource.url}
# logging.level.org.hibernate.orm.connections.pooling=WARN

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (works with any JDBC driver incl. SQLite)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# App Custom Config
app.upload.dir=data/uploads
app.lease.renewal-warning-days=30
# auto mock data seeding
app.seed.auto=false

# Show full error details in browser (dev only)
server.error.include-message=always
server.error.include-exception=true
server.error.include-stacktrace=always

# Multipart File Upload Configuration (20MB Max)
spring.servlet.multipart.enabled=true
# max-file-size default: 1MB (maximum size allowed for a single uploaded file).
spring.servlet.multipart.max-file-size=5MB
# max-request-size default: 10MB (maximum total size allowed for the entire multipart/form-data request).
spring.servlet.multipart.max-request-size=5MB

# Spring Boot DevTools & Auto Reload Configuration
spring.devtools.restart.enabled=true
spring.devtools.restart.additional-paths=src/main/java,src/main/resources
spring.devtools.livereload.enabled=true
spring.thymeleaf.cache=false
