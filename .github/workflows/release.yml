name: Release App

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Run Tests
        run: ./mvnw -B test

      - name: Build JAR
        run: ./mvnw -B package -DskipTests

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/ams-*.jar
          draft: false
          prerelease: false
          generate_release_notes: true
